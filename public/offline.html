<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #384154;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .card {
        width: min(90vw, 360px);
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(20, 39, 86, 0.12);
        text-align: center;
      }

      img {
        width: 72px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 8px;
        color: #213f93;
        font-size: 24px;
      }

      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.png" alt="Ateneo logo" />
      <h1>You're offline</h1>
      <p>The app shell is still available, but live data may be limited until your connection returns.</p>
    </div>
  </body>
</html>
